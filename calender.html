<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>LiME - Calendar</title>
	
	<meta property="og:type" content="website" />
	<meta property="og:site_name" content="LiME Network" />
	<meta property="og:title" content="Events & Downtime" />
	<meta property="og:description" content="View upcoming events, maintenance schedules, and server downtime for LiME Network." />
	<meta property="og:image" content="https://limenetwork.dev/favicon.png" />
	<meta property="og:url" content="https://limenetwork.dev/calendar" />
	<meta name="theme-color" content="#39ff14" />

	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="icon" type="image/png" href="./favicon.png">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Droid+Sans:wght@400;700&family=Abril+Fatface&display=swap" rel="stylesheet">

	<style>
		*, *::before, *::after {
			box-sizing: border-box;
			cursor: none !important;
		}

		body, html {
			margin: 0;
			padding: 0;
			min-height: 100%;
			font-family: 'Droid Sans', sans-serif;
			background-color: #0b0e14;
			background-image: url('./MainBACK.png');
			background-size: cover;
			background-position: center;
			background-repeat: no-repeat;
			background-attachment: fixed;
			color: #d5d5d5;
			overflow-x: hidden;
			display: flex;
			flex-direction: column;
		}

		/* Custom cursor */
		#cursor-i {
			position: fixed;
			pointer-events: none;
			width: 24px;
			height: 24px;
			line-height: 24px;
			text-align: center;
			font-size: 14px;
			font-weight: bold;
			color: #000;
			background: #39ff14;
			border-radius: 50%;
			box-shadow: 0 0 10px #39ff14, 0 0 20px rgba(57, 255, 20, 0.65);
			transform: translate(-50%, -50%);
			z-index: 999999;
			user-select: none;
			transition: opacity 0.15s ease;
		}

		/* Touchscreen cursor disable */
		@media (hover: none) and (pointer: coarse) {
			*, *::before, *::after { cursor: auto !important; }
			#cursor-i { display: none !important; }
		}

		/* LiME logo */
		.floating-logo {
			position: fixed;
			top: 25px;
			left: 35px;
			z-index: 1000;
		}

		.floating-logo a {
			display: flex;
			align-items: center;
			text-decoration: none;
			color: #39ff14;
			font-family: 'Abril Fatface', serif;
			font-size: 1.8em;
			text-shadow: 0 0 12px rgba(57, 255, 20, 0.35);
		}

		.floating-logo img {
			height: 48px;
			width: auto;
			display: block;
			filter: drop-shadow(0 0 8px rgba(57, 255, 20, 0.25));
		}

		/* Floating side buttons */
		.right-nav-dock {
			position: fixed;
			top: 50%;
			right: 25px;
			transform: translateY(-50%);
			background: rgba(0, 0, 0, 0.72);
			backdrop-filter: blur(10px);
			border: 1px solid rgba(57, 255, 20, 0.28);
			border-radius: 16px;
			padding: 12px 10px;
			z-index: 1000;
			box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), 0 0 15px rgba(57, 255, 20, 0.08);
		}

		.right-nav-dock ul {
			list-style: none;
			margin: 0;
			padding: 0;
			display: flex;
			flex-direction: column;
			gap: 6px;
			text-align: right;
		}

		.right-nav-dock a.wsite-menu-item {
			display: block;
			padding: 9px 16px;
			color: #ddd;
			text-decoration: none;
			font-family: 'Inter', sans-serif;
			font-weight: 600;
			font-size: 14.5px;
			border-radius: 10px;
			border-right: 3px solid transparent;
			transition: all 0.25s ease;
		}

		.right-nav-dock a.wsite-menu-item:hover {
			color: #39ff14;
			background: rgba(57, 255, 20, 0.1);
			border-right: 3px solid #39ff14;
			transform: translateX(-3px);
			text-shadow: 0 0 8px rgba(57, 255, 20, 0.4);
		}

		/* Calendar Page */
		.calendar-page-section {
			flex: 1;
			background: radial-gradient(circle at 50% 30%, rgba(12, 208, 22, 0.15) 0%, rgba(9, 88, 184, 0.15) 50%, rgba(11, 14, 20, 0.75) 100%);
			padding: 100px 20px 80px;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.lime-calendar-page {
			width: 100%;
			max-width: 1050px;
			margin: 0 auto;
		}

		.calendar-container {
			background: rgba(0, 0, 0, 0.72);
			backdrop-filter: blur(10px);
			border: 1px solid rgba(57, 255, 20, 0.28);
			border-radius: 16px;
			padding: 35px 30px;
			box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), 0 0 25px rgba(57, 255, 20, 0.15);
			max-width: 960px;
			margin: 0 auto;
		}

		.calendar-title {
			font-family: 'Inter', sans-serif;
			color: #39ff14;
			text-align: center;
			margin: 0 0 25px 0;
			font-size: 2.8em;
			text-shadow: 0 0 20px rgba(57, 255, 20, 0.3);
		}

		.calendar-wrapper {
			position: relative;
			width: 100%;
			padding-top: 75%;
			overflow: hidden;
			border-radius: 10px;
			border: 1px solid rgba(57, 255, 20, 0.2);
			background: rgba(0, 0, 0, 0.4);
		}

		.calendar-wrapper iframe {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
		}

		.calendar-caption {
			text-align: center;
			font-size: 1.05em;
			color: #ddd;
			margin: 25px 0 0 0;
			line-height: 1.6;
			font-family: 'Inter', sans-serif;
			text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
		}

		.calendar-caption a {
			color: #39ff14;
			font-weight: 600;
			text-decoration: underline;
			transition: all 0.2s ease;
		}

		.calendar-caption a:hover {
			text-shadow: 0 0 10px rgba(57, 255, 20, 0.6);
		}

		#tz-display {
			color: #39ff14;
			font-weight: 600;
		}

		/* Footer */
		.site-footer {
			text-align: center;
			padding: 18px 20px;
			background: rgba(0, 0, 0, 0.9);
			border-top: 1px solid rgba(57, 255, 20, 0.2);
			font-size: 11.5px;
			letter-spacing: 0.6px;
			color: rgb(213, 213, 213);
		}


		@media (max-width: 900px) {
			.floating-logo {
				position: static;
				display: flex;
				justify-content: center;
				padding: 20px 0 5px;
			}

			.right-nav-dock {
				position: sticky;
				top: 10px;
				right: auto;
				transform: none;
				margin: 10px auto 0;
				width: max-content;
				max-width: 94%;
				padding: 8px 12px;
			}

			.right-nav-dock ul {
				flex-direction: row;
				flex-wrap: wrap;
				justify-content: center;
				gap: 6px;
			}

			.right-nav-dock a.wsite-menu-item {
				padding: 6px 12px;
				font-size: 13.5px;
				border-right: none;
				border-bottom: 2px solid transparent;
			}

			.right-nav-dock a.wsite-menu-item:hover {
				transform: translateY(-2px);
				border-right: none;
				border-bottom: 2px solid #39ff14;
			}

			.calendar-page-section {
				padding-top: 40px;
			}

			.calendar-title {
				font-size: 2.2em;
			}

			.calendar-wrapper {
				padding-top: 95%;
			}
		}

		@media (max-width: 480px) {
			.calendar-container {
				padding: 18px 12px;
			}

			.calendar-title {
				font-size: 1.85em;
			}
		}
	</style>
</head>
<body>
	<!-- Custom cursor -->
	<div id="cursor-i">i</div>

	<!-- Floating logo -->
	<div class="floating-logo">
		<a href="https://limenetwork.dev/">
			<img src="./lime-logo-nobg.png" alt="LiME" onerror="this.style.display='none'; this.parentElement.innerText='i';" />
		</a>
	</div>

	<!-- Side buttons -->
	<nav class="right-nav-dock">
		<ul>
			<li><a href="https://limenetwork.dev/" class="wsite-menu-item">Info</a></li>
			<li><a href="https://limenetwork.dev/join" class="wsite-menu-item">Join</a></li>
			<li><a href="https://limenetwork.dev/join#rules" class="wsite-menu-item">Rules</a></li>
			<li><a href="https://limenetwork.dev/browser" class="wsite-menu-item">Browser</a></li>
			<li><a href="https://limenetwork.dev/staff" class="wsite-menu-item">Staff</a></li>
			<li><a href="#" class="wsite-menu-item">Feedback</a></li>
		</ul>
	</nav>

	<!-- GCalendar  -->
	<main class="calendar-page-section">
		<div class="lime-calendar-page">
			<div class="calendar-container">
				<h1 class="calendar-title">LiME Events & Downtime</h1>

				<div class="calendar-wrapper">
					<iframe
						id="lime-calendar-iframe"
						src="https://calendar.google.com/calendar/embed?src=9d14193a5170fe18dbbb50d4f176eb94ae54852c78b42c7fd2cf72b847a038a9%40group.calendar.google.com&amp;ctz=America/Los_Angeles&amp;mode=MONTH&amp;showTitle=0&amp;showNav=1&amp;showDate=1&amp;showPrint=0&amp;showTabs=0&amp;showCalendars=0&amp;showTz=1"
						style="border: 0; width: 100%; height: 100%; background: transparent;"
						frameborder="0"
						scrolling="no"
						title="LiME Calendar">
					</iframe>
				</div>

				<p class="calendar-caption">
					I did it Savage, its time zone based, not locked to mine. idk why was so hard -Earth (<span id="tz-display"></span>)<br>
					<a href="https://calendar.google.com/calendar/u/0?cid=9d14193a5170fe18dbbb50d4f176eb94ae54852c78b42c7fd2cf72b847a038a9%40group.calendar.google.com" target="_blank">
						Add LiME to your Calendar!
					</a>
				</p>
			</div>
		</div>
	</main>

	<!-- Footer -->
	<footer class="site-footer">
		NOT AN OFFICIAL MINECRAFT PRODUCT. NOT APPROVED BY OR ASSOCIATED WITH MOJANG OR MICROSOFT
	</footer>

	<script>
		// Custom cursor tracker
		const cursor = document.getElementById('cursor-i');
		document.addEventListener('mousemove', (e) => {
			cursor.style.left = e.clientX + 'px';
			cursor.style.top  = e.clientY + 'px';
		});
		document.addEventListener('mouseleave', () => { cursor.style.opacity = '0'; });
		document.addEventListener('mouseenter', () => { cursor.style.opacity = '1'; });

		// User local timezone
		(function() {
			try {
				const userTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
				if (userTz) {
					const iframe = document.getElementById('lime-calendar-iframe');
					const tzDisplay = document.getElementById('tz-display');
					
					}

					// For you Savage
					if (iframe && userTz !== 'America/Los_Angeles') {
						const baseUrl = "https://calendar.google.com/calendar/embed?src=9d14193a5170fe18dbbb50d4f176eb94ae54852c78b42c7fd2cf72b847a038a9%40group.calendar.google.com";
						const params = `&ctz=${encodeURIComponent(userTz)}&mode=MONTH&showTitle=0&showNav=1&showDate=1&showPrint=0&showTabs=0&showCalendars=0&showTz=1`;
						iframe.src = baseUrl + params;
					}
				}
			} catch (e) {
				// Fallback to my time zone if browser blocks timezone detection -OpticEarth
				console.warn("Timezone detection fallback to PT.");
			}
		})();
	</script>
</body>
</html>
