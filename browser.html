<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>LiME - Browser</title>


	<meta property="og:type" content="website" />
	<meta property="og:site_name" content="LiME Network" />
	<meta property="og:title" content="LiME - Browser" />
	<meta property="og:description" content="LiME Browser - our retro-themed search portal" />
	<meta property="og:image" content="https://limenetwork.dev/favicon.png" />
	<meta property="og:url" content="https://limenetwork.dev/browser" />
	<meta name="theme-color" content="#39ff14" />

	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="icon" type="image/png" href="./favicon.png">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Droid+Sans:wght@400;700&family=Abril+Fatface&display=swap" rel="stylesheet">

	<style>
		/* --- New theme & layout --- */
		*, *::before, *::after {
			box-sizing: border-box;
			cursor: none !important;
		}

		body, html {
			margin: 0;
			padding: 0;
			min-height: 100vh;
			font-family: 'Droid Sans', sans-serif;
			background-color: #0b0e14;
			background-image: url('./BrowserBACK.png');
			background-size: cover;
			background-position: center;
			background-repeat: no-repeat;
			background-attachment: fixed;
			color: #d5d5d5;
			overflow-x: hidden;
			display: flex;
			flex-direction: column;
		}

		/* Custom cursor */
		#cursor-i {
			position: fixed;
			pointer-events: none;
			width: 24px;
			height: 24px;
			line-height: 24px;
			text-align: center;
			font-size: 14px;
			font-weight: bold;
			color: #000;
			background: #39ff14;
			border-radius: 50%;
			box-shadow: 0 0 10px #39ff14, 0 0 20px rgba(57, 255, 20, 0.65);
			transform: translate(-50%, -50%);
			z-index: 999999;
			user-select: none;
			transition: opacity 0.15s ease;
		}

		/* Hide custom cursor on mobile */
		@media (hover: none) and (pointer: coarse) {
			*, *::before, *::after { cursor: auto !important; }
			#cursor-i { display: none !important; }
		}

		/* LiME logo */
		.floating-logo {
			position: fixed;
			top: 25px;
			left: 35px;
			z-index: 1000;
		}

		.floating-logo a {
			display: flex;
			align-items: center;
			text-decoration: none;
			color: #39ff14;
			font-family: 'Abril Fatface', serif;
			font-size: 1.8em;
			text-shadow: 0 0 12px rgba(57, 255, 20, 0.35);
		}

		.floating-logo img {
			height: 48px;
			width: auto;
			display: block;
			filter: drop-shadow(0 0 8px rgba(57, 255, 20, 0.25));
		}

		/* Floating right buttons */
		.right-nav-dock {
			position: fixed;
			top: 50%;
			right: 25px;
			transform: translateY(-50%);
			background: rgba(0, 0, 0, 0.72);
			backdrop-filter: blur(10px);
			border: 1px solid rgba(57, 255, 20, 0.28);
			border-radius: 16px;
			padding: 12px 10px;
			z-index: 1000;
			box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), 0 0 15px rgba(57, 255, 20, 0.08);
		}

		.right-nav-dock ul {
			list-style: none;
			margin: 0;
			padding: 0;
			display: flex;
			flex-direction: column;
			gap: 6px;
			text-align: right;
		}

		.right-nav-dock a.wsite-menu-item {
			display: block;
			padding: 9px 16px;
			color: #ddd;
			text-decoration: none;
			font-family: 'Inter', sans-serif;
			font-weight: 600;
			font-size: 14.5px;
			border-radius: 10px;
			border-right: 3px solid transparent;
			transition: all 0.25s ease;
		}

		.right-nav-dock a.wsite-menu-item:hover,
		.right-nav-dock a.wsite-menu-item.active {
			color: #39ff14;
			background: rgba(57, 255, 20, 0.1);
			border-right: 3px solid #39ff14;
			transform: translateX(-3px);
			text-shadow: 0 0 8px rgba(57, 255, 20, 0.4);
		}

		/* Main background wrapper - semi-transparent (not really) overlay so background shows through */
		.portal-section {
			flex: 1;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 100px 20px 80px;
			background: radial-gradient(circle at 50% 30%, rgba(12, 208, 22, 0.15) 0%, rgba(9, 88, 184, 0.15) 50%, rgba(11, 14, 20, 0.75) 100%);
		}

		/* Footer */
		.site-footer {
			text-align: center;
			padding: 18px 20px;
			background: rgba(0, 0, 0, 0.9);
			border-top: 1px solid rgba(57, 255, 20, 0.2);
			font-size: 11.5px;
			letter-spacing: 0.6px;
			color: rgb(213, 213, 213);
		}

		/* Mobile fix for main layout */
		@media (max-width: 900px) {
			.floating-logo {
				position: static;
				display: flex;
				justify-content: center;
				padding: 20px 0 5px;
			}

			.right-nav-dock {
				position: sticky;
				top: 10px;
				right: auto;
				transform: none;
				margin: 10px auto 0;
				width: max-content;
				max-width: 94%;
				padding: 8px 12px;
			}

			.right-nav-dock ul {
				flex-direction: row;
				flex-wrap: wrap;
				justify-content: center;
				gap: 6px;
			}

			.right-nav-dock a.wsite-menu-item {
				padding: 6px 12px;
				font-size: 13.5px;
				border-right: none;
				border-bottom: 2px solid transparent;
			}

			.right-nav-dock a.wsite-menu-item:hover,
			.right-nav-dock a.wsite-menu-item.active {
				transform: translateY(-2px);
				border-right: none;
				border-bottom: 2px solid #39ff14;
			}

			.portal-section {
				padding-top: 40px;
			}
		}


		/* Thank you, pharmacist-sabot */
		.win98-container {
			width: 100%;
			max-width: 30rem;
			margin: 2rem auto;
			font-family: "Tahoma", "Pixelated MS Sans Serif", sans-serif;
			color: #000000;
			position: relative;
			isolation: isolate;
			--win98-blue: #0a246a;
			--win98-light: #c0c0c0;
			--win98-dark: #808080;
			--win98-white: #ffffff;
			--win98-black: #000000;
		}
		.win98-window {
			background: var(--win98-light);
			border: 2px solid;
			border-color: var(--win98-white) var(--win98-dark) var(--win98-dark)
				var(--win98-white);
			position: relative;
			z-index: 10;
			transition: all 0.3s ease;
		}
		.win98-titlebar {
			background: linear-gradient(to right, var(--win98-blue), #0a248a);
			color: white;
			padding: 3px 2px;
			display: flex;
			justify-content: space-between;
			align-items: center;
			border-bottom: 1px solid var(--win98-dark);
			position: relative;
			z-index: 20;
		}
		.win98-title {
			font-size: 0.8rem;
			font-weight: bold;
			margin-left: 2px;
			letter-spacing: 0.5px;
		}
		.win98-controls {
			display: flex;
			gap: 2px;
			margin-right: 2px;
		}
		.win98-button {
			width: 16px;
			height: 14px;
			background: var(--win98-light);
			border: 1px solid;
			border-color: var(--win98-white) var(--win98-dark) var(--win98-dark)
				var(--win98-white);
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 0.7rem;
			font-weight: bold;
			cursor: pointer;
			user-select: none;
		}
		.win98-button:active {
			border-color: var(--win98-dark) var(--win98-white) var(--win98-white)
				var(--win98-dark);
			padding: 1px 0 0 1px;
		}
		.win98-content {
			padding: 8px;
		}
		.win98-menu-bar {
			display: flex;
			gap: 15px;
			margin-bottom: 10px;
			padding: 2px 5px;
			background: var(--win98-light);
			border: 1px solid;
			border-color: var(--win98-white) var(--win98-dark) var(--win98-dark)
				var(--win98-white);
		}
		.win98-menu-item {
			font-size: 0.8rem;
			cursor: pointer;
			padding: 1px 3px;
		}
		.win98-menu-item:hover {
			background: var(--win98-blue);
			color: white;
		}
		.win98-menu-item.active {
			background: var(--win98-blue);
			color: white;
		}
		.win98-input-frame {
			display: flex;
			align-items: center;
			gap: 8px;
			margin-bottom: 15px;
		}
		.win98-input-label {
			font-size: 0.8rem;
			font-weight: bold;
			min-width: 40px;
		}
		.win98-input {
			flex: 1;
			height: 22px;
			background: white;
			border: 2px solid;
			border-color: var(--win98-white) var(--win98-dark) var(--win98-dark)
				var(--win98-white);
			font-family: "Tahoma", sans-serif;
			font-size: 0.8rem;
			padding: 0 3px;
			outline: none;
		}
		.win98-input:focus {
			border-color: var(--win98-white) var(--win98-dark) var(--win98-dark)
				var(--win98-white);
			background: #ffffe0;
		}
		.win98-iframe {
			width: 100%;
			height: 300px;
			background: white;
			border: 2px solid;
			border-color: var(--win98-dark) var(--win98-white) var(--win98-white) var(--win98-dark);
			margin-bottom: 15px;
			display: none;
		}
		.win98-status-bar {
			display: flex;
			justify-content: space-between;
			align-items: center;
			background: var(--win98-dark);
			color: white;
			padding: 2px 5px;
			font-size: 0.7rem;
			border-top: 1px solid var(--win98-white);
			min-height: 18px;
		}
		.win98-status-indicators {
			display: flex;
			gap: 5px;
		}
		.win98-indicator {
			background: var(--win98-white);
			color: var(--win98-black);
			padding: 0 3px;
			border: 1px solid;
			border-color: var(--win98-white) var(--win98-dark) var(--win98-dark)
				var(--win98-white);
			font-weight: bold;
		}
		.win98-resize-handle {
			position: absolute;
			bottom: 0;
			right: 0;
			width: 15px;
			height: 15px;
			background: linear-gradient(
				135deg,
				transparent 0%,
				transparent 50%,
				var(--win98-dark) 50%,
				var(--win98-dark) 60%,
				transparent 60%
			);
			cursor: nw-resize;
		}
		.secret-overlay {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: radial-gradient(
				circle at center,
				rgba(0, 255, 255, 0.1) 0%,
				transparent 70%
			);
			opacity: 0;
			transition: all 0.8s ease;
			z-index: 5;
			pointer-events: none;
		}
		.matrix-rain {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background-image: linear-gradient(
				0deg,
				transparent 0%,
				rgba(0, 255, 0, 0.1) 2%,
				transparent 4%
			);
			background-size: 100% 30px;
			opacity: 0;
			z-index: 6;
			pointer-events: none;
			animation: matrix-fall 2s linear infinite;
		}
		.glitch-effect {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			opacity: 0;
			z-index: 7;
			pointer-events: none;
			transition: opacity 0.3s ease;
		}
		.hologram-projection {
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			border: 2px solid rgba(0, 255, 255, 0.5);
			border-radius: 0;
			opacity: 0;
			z-index: 4;
			pointer-events: none;
			box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
		}
		.win98-container:hover .win98-window {
			transform: translateY(-1px);
		}
		.win98-container:hover .win98-button {
			background: #d0d0d0;
		}
		.win98-container:hover .secret-overlay {
			opacity: 0.2;
		}
		.win98-container:focus-within .win98-window {
			background: linear-gradient(145deg, #1a1a2a, #0a0a1a);
			border: 2px solid #00ffff;
			transform: perspective(1000px) rotateX(3deg) translateY(-5px);
			position: relative;
			z-index: 100;
		}
		.win98-container:focus-within .win98-titlebar {
			background: linear-gradient(to right, #001122, #003344);
			border-bottom: 1px solid #00ffff;
			animation: title-glow 2s ease-in-out infinite alternate;
		}
		.win98-container:focus-within .win98-title {
			color: #00ffff;
			text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
			animation: text-flicker 3s ease-in-out infinite;
		}
		.win98-container:focus-within .win98-button {
			background: linear-gradient(145deg, #2a2a3a, #1a1a2a);
			border: 1px solid #00ffff;
			color: #00ffff;
			box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
		}
		.win98-container:focus-within .win98-content {
			background: rgba(10, 10, 20, 0.8);
			backdrop-filter: blur(3px);
			-webkit-backdrop-filter: blur(3px);
		}
		.win98-container:focus-within .win98-menu-bar {
			background: linear-gradient(90deg, #1a1a2a, #2a2a3a);
			border: 1px solid #00ffff;
		}
		.win98-container:focus-within .win98-menu-item {
			color: #00ffff;
			text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
		}
		.win98-container:focus-within .win98-menu-item:hover {
			background: linear-gradient(90deg, #00ffff, #0088ff);
			color: #000;
			text-shadow: none;
		}
		.win98-container:focus-within .win98-menu-item.active {
			background: linear-gradient(90deg, #00ffff, #0088ff);
			color: #000;
			text-shadow: none;
		}
		.win98-container:focus-within .win98-input-frame {
			border: 1px solid rgba(0, 255, 255, 0.2);
			padding: 8px;
			border-radius: 2px;
			background: rgba(20, 20, 30, 0.3);
		}
		.win98-container:focus-within .win98-input-label {
			color: #00ffff;
			text-shadow: 0 0 8px rgba(0, 255, 255, 0.6);
		}
		.win98-container:focus-within .win98-input {
			background: linear-gradient(145deg, #000011, #000022);
			border: 2px solid #00ffff;
			color: #00ffff;
			box-shadow:
				inset 0 0 15px rgba(0, 0, 0, 0.8),
				0 0 10px rgba(0, 255, 255, 0.2);
			text-shadow: 0 0 8px rgba(0, 255, 255, 0.5);
		}
		.win98-container:focus-within .win98-input::placeholder {
			color: #4488aa;
			font-style: italic;
		}
		.win98-container:focus-within .win98-status-bar {
			background: linear-gradient(90deg, #0a1a2a, #0a2a3a);
			border-top: 1px solid #00ffff;
			color: #00ffff;
			text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
		}
		.win98-container:focus-within .win98-indicator {
			background: linear-gradient(145deg, #00ffff, #0088ff);
			color: #000;
			border: 1px solid #00ffff;
			box-shadow: 0 0 8px rgba(0, 255, 255, 0.3);
		}
		.win98-container:focus-within .win98-resize-handle {
			background: linear-gradient(
				135deg,
				transparent 0%,
				transparent 50%,
				#00ffff 50%,
				#00ffff 60%,
				transparent 60%
			);
			box-shadow: 0 0 10px #00ffff;
		}
		.win98-container:focus-within .secret-overlay {
			opacity: 0.6;
			animation: overlay-pulse 4s ease-in-out infinite;
		}
		.win98-container:focus-within .matrix-rain {
			opacity: 0.4;
			animation: matrix-fall 0.5s linear infinite;
		}
		.win98-container:focus-within .glitch-effect {
			opacity: 0.5;
			animation: glitch-subtle 0.3s ease-in-out infinite alternate;
		}
		.win98-container:focus-within .hologram-projection {
			opacity: 0.7;
			animation: projection-pulse 3s ease-in-out infinite;
		}
		/* Animations */
		@keyframes title-glow {
			0% {
				box-shadow: 0 0 8px rgba(0, 255, 255, 0.4);
			}
			100% {
				box-shadow: 0 0 20px rgba(0, 255, 255, 0.7);
			}
		}
		@keyframes text-flicker {
			0%,
			100% {
				opacity: 1;
			}
			50% {
				opacity: 0.9;
			}
		}
		@keyframes matrix-fall {
			0% {
				background-position: 0 0;
			}
			100% {
				background-position: 0 30px;
			}
		}
		@keyframes overlay-pulse {
			0%,
			100% {
				opacity: 0.4;
				transform: scale(1);
			}
			50% {
				opacity: 0.7;
				transform: scale(1.01);
			}
		}
		@keyframes glitch-subtle {
			0% {
				transform: translate(0);
				opacity: 0.5;
			}
			20% {
				transform: translate(-1px, 1px);
				opacity: 0.7;
			}
			40% {
				transform: translate(1px, -1px);
				opacity: 0.5;
			}
			60% {
				transform: translate(-0.5px, 0.5px);
				opacity: 0.6;
			}
			80% {
				transform: translate(0.5px, -0.5px);
				opacity: 0.7;
			}
			100% {
				transform: translate(0);
				opacity: 0.5;
			}
		}
		@keyframes projection-pulse {
			0%,
			100% {
				opacity: 0.5;
				box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
			}
			50% {
				opacity: 0.8;
				box-shadow: 0 0 30px rgba(0, 255, 255, 0.4);
			}
		}
		/* Phone shit, this sucked */
		@media (max-width: 480px) {
			.win98-container {
				margin: 1rem auto;
			}
			.win98-menu-bar {
				gap: 10px;
				flex-wrap: wrap;
				justify-content: center;
			}
			.win98-input-frame {
				flex-direction: column;
				align-items: flex-start;
			}
			.win98-input-label {
				margin-bottom: 5px;
			}
			.win98-resize-handle {
				display: none;
			}
			.win98-container:focus-within .win98-window {
				transform: none; /* Disable 3D transform on mobile for better performance */
			}
		}
	</style>
</head>
<body>
	<!-- Cursor i -->
	<div id="cursor-i">i</div>

	<!-- Floating logo -->
	<div class="floating-logo">
		<a href="https://limenetwork.dev/">
			<img src="./lime-logo-nobg.png" alt="LiME" onerror="this.style.display='none'; this.parentElement.innerText='i';" />
		</a>
	</div>

	<!-- Right side navigation buttons -->
	<nav class="right-nav-dock">
		<ul>
			<li><a href="https://limenetwork.dev/" class="wsite-menu-item">Info</a></li>
			<li><a href="https://limenetwork.dev/join" class="wsite-menu-item">Join</a></li>
			<li><a href="https://limenetwork.dev/rules" class="wsite-menu-item">Rules</a></li>
			<li><a href="https://limenetwork.dev/browser" class="wsite-menu-item active">Browser</a></li>
			<li><a href="https://limenetwork.dev/staff" class="wsite-menu-item">Staff</a></li>
			<li><a href="#" class="wsite-menu-item">Feedback</a></li>
		</ul>
	</nav>


	<main class="portal-section">
		<!-- I see you ;) - OpticEarth -->
		<div class="win98-container">
			<div class="win98-window">
				<div class="win98-titlebar">
					<div class="win98-title">LiME Browser - our retro-themed search portal</div>
					<div class="win98-controls">
						<div class="win98-button win98-minimize" onclick="searchInIframe()" title="Search in iframe">_</div>
						<div class="win98-button win98-maximize" onclick="searchNormal()" title="Search normally">□</div>
						<div class="win98-button win98-close" onclick="window.location.href='https://limenetwork.dev/arcade.html'" title="Go to Arcade">×</div>
					</div>
				</div>
				<div class="win98-content">
					<div class="win98-menu-bar">
						<span class="win98-menu-item active">Ecosia</span>
						<span class="win98-menu-item">Bing</span>
						<span class="win98-menu-item">Google</span>
						<span class="win98-menu-item">Yahoo</span>
						<span class="win98-menu-item">DuckDuckGo</span>
					</div>

					<form id="search-form" action="https://www.ecosia.org/search" method="get" target="_self">
						<div class="win98-input-frame">
							<div class="win98-input-label">Query:</div>
							<input
								type="text"
								name="q"
								class="win98-input"
								placeholder="Enter search term..."
							/>
						</div>
					</form>
					
					<!-- Iframe for minimize button functionality -->
					<iframe name="results-frame" id="results-frame" class="win98-iframe"></iframe>

					<div class="win98-status-bar">
						<div class="win98-status-text">Ready</div>
						<div class="win98-status-indicators">
							<div class="win98-indicator">NUM</div>
							<div class="win98-indicator">CAPS</div>
						</div>
					</div>
				</div>
				<div class="win98-resize-handle"></div>
			</div>
			<div class="secret-overlay"></div>
			<div class="matrix-rain"></div>
			<div class="glitch-effect"></div>
			<div class="hologram-projection"></div>
		</div>
	</main>

	<!-- Footer -->
	<footer class="site-footer">
		NOT AN OFFICIAL MINECRAFT PRODUCT. NOT APPROVED BY OR ASSOCIATED WITH MOJANG OR MICROSOFT
	</footer>

	<script>
		// Custom cursor from main page
		const cursor = document.getElementById('cursor-i');
		document.addEventListener('mousemove', (e) => {
			cursor.style.left = e.clientX + 'px';
			cursor.style.top  = e.clientY + 'px';
		});
		document.addEventListener('mouseleave', () => { cursor.style.opacity = '0'; });
		document.addEventListener('mouseenter', () => { cursor.style.opacity = '1'; });

		// Web portal scripts
		function switchEngine(engine) {
			const form = document.getElementById('search-form');
			const input = form.querySelector('.win98-input');
			if (engine === 'Ecosia') {
				form.action = 'https://www.ecosia.org/search';
				input.name = 'q';
			} else if (engine === 'Bing') {
				form.action = 'https://www.bing.com/search';
				input.name = 'q';
			} else if (engine === 'Google') {
				form.action = 'https://www.google.com/search';
				input.name = 'q';
			} else if (engine === 'Yahoo') {
				form.action = 'https://search.yahoo.com/search';
				input.name = 'p';
			} else if (engine === 'DuckDuckGo') {
				form.action = 'https://duckduckgo.com/';
				input.name = 'q';
			}
		}

		// Button functions
		function searchInIframe() {
			const form = document.getElementById('search-form');
			const iframe = document.getElementById('results-frame');
			const input = form.querySelector('.win98-input');
			
			form.target = 'results-frame';
			iframe.style.display = 'block'; // Show iframe
			
			if (input.value.trim() !== '') {
				form.submit();
			}
		}

		function searchNormal() {
			const form = document.getElementById('search-form');
			const iframe = document.getElementById('results-frame');
			const input = form.querySelector('.win98-input');
			
			form.target = '_self'; 
			iframe.style.display = 'none'; // Hide the iframe
			
			if (input.value.trim() !== '') {
				form.submit();
			}
		}

		const menuItems = document.querySelectorAll('.win98-menu-item');
		menuItems.forEach(item => {
			item.addEventListener('click', () => {
				menuItems.forEach(i => i.classList.remove('active'));
				item.classList.add('active');
				switchEngine(item.textContent);
			});
		});

		document.getElementById('search-form').addEventListener('submit', function(e) {
			if (this.target === 'results-frame') return; 
			e.preventDefault();
			searchNormal();
		});
	</script>
</body>
</html>
